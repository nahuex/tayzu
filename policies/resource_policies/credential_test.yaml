---
name: CredentialTest
description: >-
  Task 9.1: the org API-credential actions list, create, rotate and revoke on
  kind `credential` are admin-only and tenant-bound. Spec scenarios "Non-admin
  cannot ..." at the policy level, design D3 and 002 D8 (explicit cross-tenant
  deny). Resource ids are opaque: `list`, `new`, or the `apikey` id.
tests:
  - name: Admin of the same tenant is allowed every credential action
    input:
      principals: [admin_t1]
      resources: [credential_t1, credential_list_t1, credential_new_t1]
      actions: [list, create, rotate, revoke]
    expected:
      - principal: admin_t1
        resource: credential_t1
        actions: &admin_allowed
          list: EFFECT_ALLOW
          create: EFFECT_ALLOW
          rotate: EFFECT_ALLOW
          revoke: EFFECT_ALLOW
      - principal: admin_t1
        resource: credential_list_t1
        actions: *admin_allowed
      - principal: admin_t1
        resource: credential_new_t1
        actions: *admin_allowed

  - name: Non-admin principals are denied every credential action
    input:
      principals: [member_t1, member_platform_t1, member_moderator_service_t1, unknown_role_t1]
      resources: [credential_t1, credential_list_t1, credential_new_t1]
      actions: [list, create, rotate, revoke]
    expected:
      - principal: member_t1
        resource: credential_t1
        actions: &none_allowed
          list: EFFECT_DENY
          create: EFFECT_DENY
          rotate: EFFECT_DENY
          revoke: EFFECT_DENY
      - principal: member_t1
        resource: credential_list_t1
        actions: *none_allowed
      - principal: member_t1
        resource: credential_new_t1
        actions: *none_allowed
      - principal: member_platform_t1
        resource: credential_t1
        actions: *none_allowed
      - principal: member_moderator_service_t1
        resource: credential_t1
        actions: *none_allowed
      - principal: unknown_role_t1
        resource: credential_t1
        actions: *none_allowed
      - principal: unknown_role_t1
        resource: credential_list_t1
        actions: *none_allowed

  - name: Admin of another tenant is denied on a credential of tenant t1
    input:
      principals: [admin_t2]
      resources: [credential_t1, credential_list_t1, credential_new_t1]
      actions: [list, create, rotate, revoke]
    expected:
      - principal: admin_t2
        resource: credential_t1
        actions: *none_allowed
      - principal: admin_t2
        resource: credential_list_t1
        actions: *none_allowed
      - principal: admin_t2
        resource: credential_new_t1
        actions: *none_allowed

  - name: Admin of tenant t1 is denied on a credential resolved to tenant t2
    input:
      principals: [admin_t1]
      resources: [credential_t2, credential_list_t2]
      actions: [list, create, rotate, revoke]
    expected:
      - principal: admin_t1
        resource: credential_t2
        actions: *none_allowed
      - principal: admin_t1
        resource: credential_list_t2
        actions: *none_allowed

  - name: Admin of tenant t2 is allowed on its own credential, a member of t2 is not
    input:
      principals: [admin_t2, member_platform_t2]
      resources: [credential_t2, credential_list_t2]
      actions: [list, create, rotate, revoke]
    expected:
      - principal: admin_t2
        resource: credential_t2
        actions: *admin_allowed
      - principal: admin_t2
        resource: credential_list_t2
        actions: *admin_allowed
      - principal: member_platform_t2
        resource: credential_t2
        actions: *none_allowed
      - principal: member_platform_t2
        resource: credential_list_t2
        actions: *none_allowed

  - name: Admin without a tenant attribute fails closed
    input:
      principals: [admin_no_tenant]
      resources: [credential_t1, credential_list_t1, credential_new_t1]
      actions: [list, create, rotate, revoke]
    expected:
      - principal: admin_no_tenant
        resource: credential_t1
        actions: *none_allowed
      - principal: admin_no_tenant
        resource: credential_list_t1
        actions: *none_allowed
      - principal: admin_no_tenant
        resource: credential_new_t1
        actions: *none_allowed

  - name: An action the design does not name stays denied, even for the admin
    input:
      principals: [admin_t1]
      resources: [credential_t1]
      actions: [view, update, delete, export, read]
    expected:
      - principal: admin_t1
        resource: credential_t1
        actions:
          view: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY
          export: EFFECT_DENY
          read: EFFECT_DENY
