---
name: CatalogEntityTest
description: >-
  Task 8.2: catalog_entity denies by default. Scenario "Action with no
  matching rule is denied".
tests:
  # Scenario: Action with no matching rule is denied
  - name: Member has no rule for delete or an unknown action on an unowned entity
    input:
      principals: [member_t1, member_platform_t1]
      resources: [entity_service_unowned_t1]
      actions: [delete, export]
    expected:
      - principal: member_t1
        resource: entity_service_unowned_t1
        actions: &no_delete
          delete: EFFECT_DENY
          export: EFFECT_DENY
      - principal: member_platform_t1
        resource: entity_service_unowned_t1
        actions: *no_delete

  - name: A principal with an unrecognized role and no grant is denied everything
    input:
      principals: [unknown_role_t1]
      resources: [entity_service_unowned_t1]
      actions: [view, list, create, update, delete]
    expected:
      - principal: unknown_role_t1
        resource: entity_service_unowned_t1
        actions:
          view: EFFECT_DENY
          list: EFFECT_DENY
          create: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY

  - name: A principal with no tenantId attribute is denied (fails closed)
    input:
      principals: [admin_no_tenant]
      resources: [entity_service_unowned_t1]
      actions: [view, update]
    expected:
      - principal: admin_no_tenant
        resource: entity_service_unowned_t1
        actions:
          view: EFFECT_DENY
          update: EFFECT_DENY

  - name: Admin of the same tenant can do everything on an entity owned by another team
    input:
      principals: [admin_t1]
      resources: [entity_service_other_team_t1]
      actions: [view, list, create, update, delete]
    expected:
      - principal: admin_t1
        resource: entity_service_other_team_t1
        actions:
          view: EFFECT_ALLOW
          list: EFFECT_ALLOW
          create: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW
