---
name: ServiceAccountTest
description: >-
  Task 10.2: the actions create and delete on kind `service_account` are
  admin-only and tenant-bound (design D3, 002 D8 explicit cross-tenant deny),
  and every action is denied unless `accountKind` is `service` (Resolved
  decision Q62: absent or `standard` denies). Resource ids are opaque: `new` for
  create, the `svc-...` identifier for delete.
tests:
  - name: Admin of the same tenant is allowed create and delete on a service account
    input:
      principals: [admin_t1]
      resources: [service_account_t1, service_account_new_t1]
      actions: [create, delete]
    expected:
      - principal: admin_t1
        resource: service_account_t1
        actions: &admin_allowed
          create: EFFECT_ALLOW
          delete: EFFECT_ALLOW
      - principal: admin_t1
        resource: service_account_new_t1
        actions: *admin_allowed

  - name: Non-admin principals are denied create and delete
    input:
      principals: [member_t1, member_platform_t1, member_moderator_service_t1, unknown_role_t1]
      resources: [service_account_t1, service_account_new_t1]
      actions: [create, delete]
    expected:
      - principal: member_t1
        resource: service_account_t1
        actions: &none_allowed
          create: EFFECT_DENY
          delete: EFFECT_DENY
      - principal: member_t1
        resource: service_account_new_t1
        actions: *none_allowed
      - principal: member_platform_t1
        resource: service_account_t1
        actions: *none_allowed
      - principal: member_moderator_service_t1
        resource: service_account_t1
        actions: *none_allowed
      - principal: unknown_role_t1
        resource: service_account_t1
        actions: *none_allowed
      - principal: unknown_role_t1
        resource: service_account_new_t1
        actions: *none_allowed

  - name: Admin of another tenant is denied on a service account of tenant t1
    input:
      principals: [admin_t2]
      resources: [service_account_t1, service_account_new_t1]
      actions: [create, delete]
    expected:
      - principal: admin_t2
        resource: service_account_t1
        actions: *none_allowed
      - principal: admin_t2
        resource: service_account_new_t1
        actions: *none_allowed

  - name: Admin of tenant t1 is denied on a service account resolved to tenant t2
    input:
      principals: [admin_t1]
      resources: [service_account_t2]
      actions: [create, delete]
    expected:
      - principal: admin_t1
        resource: service_account_t2
        actions: *none_allowed

  - name: Admin of tenant t2 is allowed on its own service account, a member of t2 is not
    input:
      principals: [admin_t2, member_platform_t2]
      resources: [service_account_t2]
      actions: [create, delete]
    expected:
      - principal: admin_t2
        resource: service_account_t2
        actions: *admin_allowed
      - principal: member_platform_t2
        resource: service_account_t2
        actions: *none_allowed

  - name: Admin without a tenant attribute fails closed
    input:
      principals: [admin_no_tenant]
      resources: [service_account_t1, service_account_new_t1]
      actions: [create, delete]
    expected:
      - principal: admin_no_tenant
        resource: service_account_t1
        actions: *none_allowed
      - principal: admin_no_tenant
        resource: service_account_new_t1
        actions: *none_allowed

  - name: A standard or absent accountKind is denied for every action, even for the admin
    input:
      principals: [admin_t1]
      resources: [service_account_standard_t1, service_account_no_kind_t1]
      actions: [create, delete]
    expected:
      - principal: admin_t1
        resource: service_account_standard_t1
        actions: *none_allowed
      - principal: admin_t1
        resource: service_account_no_kind_t1
        actions: *none_allowed

  - name: An action the design does not name stays denied, even for the admin
    input:
      principals: [admin_t1]
      resources: [service_account_t1, service_account_standard_t1, service_account_no_kind_t1]
      actions: [view, list, update, updateStatus, invite, rotate, revoke, export]
    expected:
      - principal: admin_t1
        resource: service_account_t1
        actions: &unnamed_denied
          view: EFFECT_DENY
          list: EFFECT_DENY
          update: EFFECT_DENY
          updateStatus: EFFECT_DENY
          invite: EFFECT_DENY
          rotate: EFFECT_DENY
          revoke: EFFECT_DENY
          export: EFFECT_DENY
      - principal: admin_t1
        resource: service_account_standard_t1
        actions: *unnamed_denied
      - principal: admin_t1
        resource: service_account_no_kind_t1
        actions: *unnamed_denied
