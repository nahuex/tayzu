# Resource kind `service_account` (043 design D3, task 10.2): the actions
# `create` and `delete`, `admin`-only. `member` has no rule at all, so every
# action stays denied by default. Rule order: (1) the explicit cross-tenant deny
# of 002 D8 (the identity router passes the target's real tenant as the resource
# tenant); (2) the target-type deny of Resolved decision Q62: every action is
# denied unless the resolved target has accountKind "service", so a route of
# this kind can never act on a human `_user`. An absent accountKind is
# `standard` and denies; has() guards the attribute because strictEvaluation
# turns a CEL error into a deny of the whole action. For `create` the attribute
# is the `service` of the account being created, and the first, target-less
# check of the wrapper (D10) carries `accountKind: service`. Resource ids are
# opaque: `new` for create, the `svc-...` identifier for delete.
---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: service_account
  version: default
  importDerivedRoles:
    - same_tenant
  rules:
    - actions: ['*']
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: R.attr.tenantId != P.attr.tenantId
    - actions: ['*']
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: '!has(R.attr.accountKind) || R.attr.accountKind != "service"'
    - actions: [create, delete]
      effect: EFFECT_ALLOW
      derivedRoles: [same_tenant]
      condition:
        match:
          expr: '"admin" in P.roles'
