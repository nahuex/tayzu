---
name: SameTenantTest
description: >-
  A cross-tenant request is denied on every resource kind even when the
  principal otherwise holds a matching role, team, or moderator grant
  (task 8.1, spec "Tenant isolation" defense in depth, design D7).
tests:
  - name: Admin of another tenant is denied every action on every kind
    input:
      principals: [admin_t2]
      resources:
        - blueprint_t1
        - entity_service_unowned_t1
        - entity_service_platform_t1
        - team_t1
        - user_t1
        - credential_t1
        - credential_list_t1
        - service_account_t1
        - service_account_new_t1
      actions: [view, list, create, update, delete, rotate, revoke]
    expected:
      - principal: admin_t2
        resource: blueprint_t1
        actions: &all_denied
          view: EFFECT_DENY
          list: EFFECT_DENY
          create: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY
          rotate: EFFECT_DENY
          revoke: EFFECT_DENY
      - principal: admin_t2
        resource: entity_service_unowned_t1
        actions: *all_denied
      - principal: admin_t2
        resource: entity_service_platform_t1
        actions: *all_denied
      - principal: admin_t2
        resource: team_t1
        actions: *all_denied
      - principal: admin_t2
        resource: user_t1
        actions: *all_denied
      - principal: admin_t2
        resource: credential_t1
        actions: *all_denied
      - principal: admin_t2
        resource: credential_list_t1
        actions: *all_denied
      - principal: admin_t2
        resource: service_account_t1
        actions: *all_denied
      - principal: admin_t2
        resource: service_account_new_t1
        actions: *all_denied

  - name: Member of the owning team's name in another tenant is denied
    input:
      principals: [member_platform_t2]
      resources: [entity_service_platform_t1]
      actions: [view, list, create, update, delete]
    expected:
      - principal: member_platform_t2
        resource: entity_service_platform_t1
        actions:
          view: EFFECT_DENY
          list: EFFECT_DENY
          create: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY

  - name: Moderator of the same blueprint id in another tenant is denied
    input:
      principals: [member_moderator_service_t2]
      resources: [entity_service_other_team_t1]
      actions: [view, list, create, update, delete]
    expected:
      - principal: member_moderator_service_t2
        resource: entity_service_other_team_t1
        actions:
          view: EFFECT_DENY
          list: EFFECT_DENY
          create: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY

  - name: Control, the same admin role inside its own tenant is allowed
    input:
      principals: [admin_t1]
      resources: [blueprint_t1, entity_service_platform_t1]
      actions: [view, update]
    expected:
      - principal: admin_t1
        resource: blueprint_t1
        actions:
          view: EFFECT_ALLOW
          update: EFFECT_ALLOW
      - principal: admin_t1
        resource: entity_service_platform_t1
        actions:
          view: EFFECT_ALLOW
          update: EFFECT_ALLOW
