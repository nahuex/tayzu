# Resource kind `user` (design D7/D8; D22 `identity.users.create` requires the
# `admin` role here). `admin` is granted everything; `member` may only view and list
# (Checkpoint 3, Q3a). Deny by default; a tenant mismatch is denied explicitly.
---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: user
  version: default
  importDerivedRoles:
    - same_tenant
  rules:
    - actions: ['*']
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: R.attr.tenantId != P.attr.tenantId
    # Task 5.4 (design D3): nobody changes their own status. R.id is the opaque
    # user id (never an email), so the comparison with P.id is not vacuous.
    - actions: [updateStatus]
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: R.id == P.id
    # Task 5.5 (design D3, Resolved decisions Q7 and Q16): service-account
    # ceiling. A service account holds `member` and no Moderator grant, always.
    # Any action on a service-account resource whose resulting portRole is not
    # `member`, or whose resulting moderatedBlueprints is non-empty, is denied
    # for every role, including the `system` actor. Every attribute is guarded
    # with has() because strictEvaluation turns a CEL error into a deny of the
    # whole action and today's callers send none of these keys; an absent
    # accountKind is `standard` (D1) and the rule does not fire.
    - actions: ['*']
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          all:
            of:
              - expr: has(R.attr.accountKind) && R.attr.accountKind == "service"
              - any:
                  of:
                    - expr: has(R.attr.portRole) && R.attr.portRole != "member"
                    - expr: has(R.attr.moderatedBlueprints) && size(R.attr.moderatedBlueprints) > 0
    - actions: ['*']
      effect: EFFECT_ALLOW
      derivedRoles: [same_tenant]
      condition:
        match:
          expr: '"admin" in P.roles'
    - actions: [view, list]
      effect: EFFECT_ALLOW
      derivedRoles: [same_tenant]
      condition:
        match:
          expr: '"member" in P.roles'
