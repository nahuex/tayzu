# Resource kind `credential` (043 design D3, task 9.1): the org API-credential
# actions `list`, `create`, `rotate` and `revoke`, all `admin`-only. `member`
# has no rule at all, so every action stays denied by default. The first rule is
# the explicit cross-tenant deny of 002 D8: the identity router passes the
# target's real tenant (an API key's `referenceId`) as the resource tenant.
# Resource ids are opaque: `list`, `new`, or the `apikey` id; the policy reads
# none of them.
---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: credential
  version: default
  importDerivedRoles:
    - same_tenant
  rules:
    - actions: ['*']
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: R.attr.tenantId != P.attr.tenantId
    - actions: [list, create, rotate, revoke]
      effect: EFFECT_ALLOW
      derivedRoles: [same_tenant]
      condition:
        match:
          expr: '"admin" in P.roles'
