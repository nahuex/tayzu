# Design D8. `member` (Better Auth `member`). Read every blueprint, entity, team
# and user, create and update entities. Nothing else on team or user.
#
# Cerbos treats a role policy as a CEILING on what the role can do, not as a
# grant: an action the ceiling omits is denied even when a resource-policy rule
# (for example the Moderator derived role) would allow it. The grants live in
# resource_policies/, which also holds the tenant check and the ownership
# narrowing (which entities a member may create or update).
#
# `delete` is on the `catalog_entity` ceiling so that the Moderator grant
# ("every entity-level action", spec "Moderator grant") and the attribute rule
# "member deletes an entity they created" (task 8.6) can reach it. No other
# resource-policy rule gives a plain member `delete`; moderator_test.yaml,
# role_policies_test.yaml and dynamic_abac_test.yaml assert that.
#
# `user` and `team`: members may only view and list them (Checkpoint 3, Q3a).
# Everything else on those kinds stays admin-only.
#
# `service_account` and `credential` (043, task 5.6) are deliberately NOT listed:
# a member has no action on them. No resource-policy rule will ever allow
# `member` there (tasks 9.1 and 10.2 allow `admin` only), so the absence of a
# rule is the ceiling and the resource policies deny by default. A role-policy
# rule cannot state an empty allow list, so no entry is written.
# role_policies_test.yaml asserts the member denial on every action of both kinds.
---
apiVersion: api.cerbos.dev/v1
rolePolicy:
  role: member
  rules:
    - resource: catalog_entity
      allowActions: [view, list, create, update, delete]
    - resource: catalog_blueprint
      allowActions: [view, list]
    - resource: team
      allowActions: [view, list]
    - resource: user
      allowActions: [view, list]
