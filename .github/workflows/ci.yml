name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tayzu
          POSTGRES_PASSWORD: tayzu
          POSTGRES_DB: tayzu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      cerbos:
        # ghcr.io/cerbos/cerbos:0.55.0, pinned by digest (design D7). No
        # shell in this image, so its own container HEALTHCHECK can't run
        # here (GitHub Actions' service `options` health-cmd always execs
        # through /bin/sh); the "Wait for Cerbos" step below polls instead.
        image: ghcr.io/cerbos/cerbos@sha256:4b9d3b58c4f11c1b8953bc798d8d086e64f276882253ab169625fddc7f432515
        env:
          CERBOS_NO_TELEMETRY: '1'
        ports:
          - 3592:3592
          - 3593:3593
    env:
      DATABASE_URL: postgres://tayzu:tayzu@localhost:5432/tayzu_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Wait for Cerbos
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3592/_cerbos/health; then exit 0; fi
            sleep 1
          done
          echo "Cerbos did not become healthy in time" >&2
          exit 1
      - run: pnpm test

  contract-check:
    name: Contract check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm contract:check

  otel-smoke-check:
    name: OTel smoke check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tayzu
          POSTGRES_PASSWORD: tayzu
          POSTGRES_DB: tayzu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      cerbos:
        # ghcr.io/cerbos/cerbos:0.55.0, pinned by digest (design D7). See the
        # "Test" job above for why this can't carry its own health-cmd.
        image: ghcr.io/cerbos/cerbos@sha256:4b9d3b58c4f11c1b8953bc798d8d086e64f276882253ab169625fddc7f432515
        env:
          CERBOS_NO_TELEMETRY: '1'
        ports:
          - 3592:3592
          - 3593:3593
    env:
      DATABASE_URL: postgres://tayzu:tayzu@localhost:5432/tayzu_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Wait for Cerbos
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3592/_cerbos/health; then exit 0; fi
            sleep 1
          done
          echo "Cerbos did not become healthy in time" >&2
          exit 1
      - run: pnpm otel-smoke-check

  dependency-audit:
    name: Dependency audit (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level=high

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so gitleaks scans every commit and not only the tip.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bash scripts/ci/gitleaks.sh

  semgrep:
    name: SAST (Semgrep OSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bash scripts/ci/semgrep.sh

  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Generate SBOM
        continue-on-error: true
        run: bash scripts/ci/syft.sh "${{ runner.temp }}/sbom.spdx.json"
      - name: Upload SBOM artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx
          path: ${{ runner.temp }}/sbom.spdx.json
          if-no-files-found: warn
