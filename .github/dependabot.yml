version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Tayzu runs on Node 22: the types must match the runtime major.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Reads compose.yaml (Cerbos) and scripts/ci/Dockerfile.images (postgres, ZAP).
  - package-ecosystem: docker
    directories:
      - /
      - /scripts/ci
    schedule:
      interval: weekly
