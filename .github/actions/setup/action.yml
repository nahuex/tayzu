name: Setup workspace
description: >
  Install pnpm and Node 22, and install workspace dependencies with a frozen
  lockfile. Callers must run actions/checkout first: a local action can only
  be resolved from an already checked-out repository. Shared by every ci.yml job so the
  install step is defined once (D1, task 1.7).

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
