# TEST-ONLY Cerbos config for the scratch instance of task 9.3. Same engine
# settings as config/cerbos.yaml (design D7): disk driver, strict evaluation.
server:
  httpListenAddr: ':3592'
  grpcListenAddr: ':3593'

storage:
  driver: disk
  disk:
    directory: /policies
    watchForChanges: false

engine:
  strictEvaluation: true

audit:
  enabled: false
