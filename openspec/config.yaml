schema: spec-driven
githubCopilot:
  cloudAgent: true

context: |
  Tayzu — Agentic SDLC Platform. The complete, fixed project rules live in
  openspec/project.md: read it in full before generating any artifact.
  All artifacts are written in English; the conversation with the human is in Spanish.
  Before proposing a change, read its row in the roadmap relevance matrix of
  docs/references/platform-engineering/README.md (Platform Engineering reference
  reports) and cite file + line range in design.md when a decision relies on one.

rules:
  design:
    - Include an observability contract (OpenTelemetry span, metric and log names with attributes).
    - Every Open Question must be asked to the human in chat with options and a recommendation before tasks.md is finalized.
  tasks:
    - Each task is one self-contained red-green-refactor TDD cycle and names the test that verifies it.
    - Include a task to update docs/architecture/system-diagram.md (Mermaid) when the change adds or alters a component, actor or network interaction.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
