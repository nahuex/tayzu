packages:
  - packages/*
  - apps/*

# pnpm 10 blocks dependency lifecycle scripts by default, and we keep it that
# way (SEC07): every entry here is an explicit decision. esbuild's postinstall
# only verifies its platform binary, which esbuild also resolves at runtime.
allowBuilds:
  esbuild: false
  # postinstall only warns to stderr about version-scheme mismatches between
  # a dependent's declared range and protobufjs's own versioning scheme; no
  # file generation or build step (@cerbos/grpc's transitive dependency).
  protobufjs: false
