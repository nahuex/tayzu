title = "tayzu gitleaks config"

[extend]
useDefault = true

# Scoped allowlist for the test-only local Postgres credential created by the
# SessionStart hook (see openspec/changes/archive/2026-09-28-001-catalog-core/tasks.md, 1.6, and
# packages/db/CLAUDE.md: it is a fixed, non-secret, localhost-only test login).
[[allowlists]]
description = "Test-only local Postgres URL for the SessionStart hook"
condition = "AND"
regexes = [
  '''postgres://tayzu:tayzu@localhost:5432/tayzu_test''',
]
paths = [
  '''^\.claude/hooks/session-start\.sh$''',
]

# Scoped allowlist for the made-up link tokens and TOTP secret the 003 web
# component tests use as fixtures (task 6.4, 6.8, 6.9). They are random-looking
# literals that reach no server; each is matched exactly, only in these files.
[[allowlists]]
description = "003 web test fixtures: made-up link tokens and TOTP secret"
condition = "AND"
regexes = [
  '''KRSXG5DTMVRXEZLUOBQWO2LMMNXWIZJAMFXGIIDTMVRXEZLUOBQXGZ3H''',
  '''Tk9_mQ2\-vX7wLp4ZrB8nYc1HdJ6sKf3GuE5aW0oNiTx''',
  '''Zq8\-Wm3_Rt5Yu7Io9Pa1Sd2Fg4Hj6Kl0Xc3Vb5Nm7Qw''',
]
paths = [
  '''^apps/web/src/auth/(accept-invitation|accept-invitation-step-up|reset-password|mfa-enrol)\.test\.tsx$''',
]

# Scoped allowlist for the made-up database password that the 048 TLS-error
# tests (task 2.2) use to prove no connection detail reaches an error message.
# It reaches no server; it is matched exactly, only in this file.
[[allowlists]]
description = "048 db test fixture: made-up database password"
condition = "AND"
regexes = [
  '''tls\-variable\-s3cr3t\-pw''',
]
paths = [
  '''^packages/db/src/connection-security\.test\.ts$''',
]
