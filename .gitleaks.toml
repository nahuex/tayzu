title = "tayzu gitleaks config"

[extend]
useDefault = true

# Scoped allowlist for the test-only local Postgres credential created by the
# SessionStart hook (see openspec/changes/001-catalog-core/tasks.md, 1.6, and
# packages/db/CLAUDE.md: it is a fixed, non-secret, localhost-only test login).
[[allowlists]]
description = "Test-only local Postgres URL for the SessionStart hook"
condition = "AND"
regexes = [
  '''postgres://tayzu:tayzu@localhost:5432/tayzu_test''',
]
paths = [
  '''^\.claude/hooks/session-start\.sh$''',
]
