# Local development services for Tayzu (laptop / Docker). The Claude Code
# cloud sandbox does not use this file: its SessionStart hook starts a local
# PostgreSQL 16 cluster instead. See docs/dev-environment/README.md.
#
# Test-only credentials. Never reuse them outside a local machine.
name: tayzu

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tayzu
      POSTGRES_PASSWORD: tayzu
      POSTGRES_DB: tayzu_test
    ports:
      # Bound to loopback only: the database is never reachable from the LAN.
      - '127.0.0.1:${TAYZU_DB_PORT:-5432}:5432'
    volumes:
      - tayzu-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tayzu -d tayzu_test']
      interval: 2s
      timeout: 3s
      retries: 30

  cerbos:
    # ghcr.io/cerbos/cerbos:0.55.0, pinned by digest (design D7).
    image: ghcr.io/cerbos/cerbos@sha256:4b9d3b58c4f11c1b8953bc798d8d086e64f276882253ab169625fddc7f432515
    command: ['server', '--config=/config/.cerbos.yaml']
    environment:
      # Cerbos's own anonymous usage telemetry, unrelated to Tayzu's
      # OpenTelemetry pipeline. Opting out keeps local/CI runs offline.
      CERBOS_NO_TELEMETRY: '1'
    volumes:
      - ./policies:/policies:ro
      - ./config/cerbos.yaml:/config/.cerbos.yaml:ro
    ports:
      # Bound to loopback only, same as the database above.
      - '127.0.0.1:${TAYZU_CERBOS_HTTP_PORT:-3592}:3592'
      - '127.0.0.1:${TAYZU_CERBOS_GRPC_PORT:-3593}:3593'
    healthcheck:
      test: ['CMD', '/cerbos', 'healthcheck', '--config=/config/.cerbos.yaml']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  tayzu-pg:
